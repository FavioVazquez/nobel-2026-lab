<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1391" width="800" height="1391" role="img" aria-labelledby="t d">
<title id="t">How a light-gated channel works, in four steps</title>
<desc id="d">A four-step drawing of how a light-gated channel works. Step 1: blue light arrives at a protein sitting in the cell membrane, with the channel closed. Step 2: a light-catching molecule inside the protein changes shape and a pore opens. Step 3: positive ions flow through the open pore into the cell. Step 4: the inside of the cell becomes less negative and the neuron fires a spike. Simplified; shapes are not to scale.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<g font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<rect width="800" height="1391" rx="28" fill="#0B1220"/><rect x="1.5" y="1.5" width="797" height="1388" rx="27" fill="none" stroke="#2A3B61" stroke-width="3"/><text x="40" y="78" font-size="38" font-weight="800" fill="#EAF0FA" text-anchor="start" >How a light-gated channel works</text><text x="40" y="118" font-size="26" font-weight="500" fill="#A3B4D2" text-anchor="start" >Light, a pore, ions, a spike</text><g transform="translate(24,156)"><rect width="348" height="527" rx="22" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><circle cx="42" cy="46" r="22" fill="#58A9FF"/><text x="42" y="55" font-size="26" font-weight="800" fill="#0B1220" text-anchor="middle" >1</text><text x="78" y="56" font-size="28" font-weight="800" fill="#EAF0FA" text-anchor="start" >Light arrives</text><text x="24" y="100" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >Blue light, around 460 to</text>
<text x="24" y="129" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >470 nanometres, reaches</text>
<text x="24" y="158" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >the protein in the cell’s</text>
<text x="24" y="187" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >outer membrane.</text><rect x="24" y="355" width="98" height="52" fill="#2B3B5F" stroke="#5873AC" stroke-width="2.5"/><rect x="226" y="355" width="98" height="52" fill="#2B3B5F" stroke="#5873AC" stroke-width="2.5"/><rect x="122" y="333" width="52" height="96" rx="16" fill="#9482F2"/><rect x="174" y="333" width="52" height="96" rx="16" fill="#9482F2"/><line x1="174" y1="337" x2="174" y2="425" stroke="#121C32" stroke-width="3"/><polygon points="120,247 228,247 198,329 150,329" fill="#58A9FF" fill-opacity=".34"/><line x1="138" y1="255" x2="159.6" y2="323" stroke="#58A9FF" stroke-width="5" stroke-linecap="round"/><line x1="174" y1="255" x2="174" y2="323" stroke="#58A9FF" stroke-width="5" stroke-linecap="round"/><line x1="210" y1="255" x2="188.4" y2="323" stroke="#58A9FF" stroke-width="5" stroke-linecap="round"/><text x="330" y="315" font-size="22" font-weight="700" fill="#58A9FF" text-anchor="end" >blue light</text><path d="M148 353 L148 401" fill="none" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="148" y1="411" x2="148" y2="447" stroke="#FFB84D" stroke-width="2.5"/><text x="148" y="471" font-size="21" font-weight="700" fill="#FFB84D" text-anchor="middle" >retinal</text><text x="174" y="511" font-size="22" font-weight="600" fill="#A3B4D2" text-anchor="middle" >channel closed</text></g><path d="M388 190 l22 12 l-22 12" fill="none" stroke="#A3B4D2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(428,156)"><rect width="348" height="527" rx="22" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><circle cx="42" cy="46" r="22" fill="#58A9FF"/><text x="42" y="55" font-size="26" font-weight="800" fill="#0B1220" text-anchor="middle" >2</text><text x="78" y="56" font-size="28" font-weight="800" fill="#EAF0FA" text-anchor="start" >Channel opens</text><text x="24" y="100" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >A light-catching molecule</text>
<text x="24" y="129" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >inside the protein, retinal,</text>
<text x="24" y="158" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >changes shape. The</text>
<text x="24" y="187" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >protein opens a pore</text>
<text x="24" y="216" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >through itself.</text><rect x="24" y="355" width="76" height="52" fill="#2B3B5F" stroke="#5873AC" stroke-width="2.5"/><rect x="248" y="355" width="76" height="52" fill="#2B3B5F" stroke="#5873AC" stroke-width="2.5"/><rect x="100" y="333" width="52" height="96" rx="16" fill="#9482F2"/><rect x="196" y="333" width="52" height="96" rx="16" fill="#9482F2"/><polygon points="120,247 228,247 198,329 150,329" fill="#58A9FF" fill-opacity=".22"/><circle cx="126" cy="377" r="30" fill="#FFB84D" fill-opacity=".28"/><path d="M126 353 L126 367 L136 379 L136 401" fill="none" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="136" y1="411" x2="136" y2="447" stroke="#FFB84D" stroke-width="2.5"/><text x="136" y="471" font-size="21" font-weight="700" fill="#FFB84D" text-anchor="middle" >retinal, new shape</text><text x="174" y="511" font-size="22" font-weight="600" fill="#A3B4D2" text-anchor="middle" >pore open</text></g><g transform="translate(24,713)"><rect width="348" height="498" rx="22" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><circle cx="42" cy="46" r="22" fill="#58A9FF"/><text x="42" y="55" font-size="26" font-weight="800" fill="#0B1220" text-anchor="middle" >3</text><text x="78" y="56" font-size="28" font-weight="800" fill="#EAF0FA" text-anchor="start" >Ions flow in</text><text x="24" y="100" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >Positive ions flow</text>
<text x="24" y="129" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >through the open pore,</text>
<text x="24" y="158" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >mostly into the cell.</text><rect x="24" y="326" width="76" height="52" fill="#2B3B5F" stroke="#5873AC" stroke-width="2.5"/><rect x="248" y="326" width="76" height="52" fill="#2B3B5F" stroke="#5873AC" stroke-width="2.5"/><rect x="100" y="304" width="52" height="96" rx="16" fill="#9482F2"/><rect x="196" y="304" width="52" height="96" rx="16" fill="#9482F2"/><text x="24" y="236" font-size="21" font-weight="600" fill="#A3B4D2" text-anchor="start" >outside</text><text x="24" y="482" font-size="21" font-weight="600" fill="#A3B4D2" text-anchor="start" >inside</text><circle cx="102" cy="270" r="13" fill="#45DDB7"/><text x="102" y="277" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="236" cy="254" r="13" fill="#45DDB7"/><text x="236" y="261" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="274" cy="310" r="13" fill="#45DDB7"/><text x="274" y="317" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="170" cy="266" r="13" fill="#45DDB7"/><text x="170" y="273" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="174" cy="330" r="13" fill="#45DDB7"/><text x="174" y="337" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="174" cy="370" r="13" fill="#45DDB7"/><text x="174" y="377" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="96" cy="434" r="13" fill="#45DDB7"/><text x="96" y="441" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="188" cy="448" r="13" fill="#45DDB7"/><text x="188" y="455" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><circle cx="256" cy="426" r="13" fill="#45DDB7"/><text x="256" y="433" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle" >+</text><path d="M162 298 l12 11 l12 -11" fill="none" stroke="#45DDB7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M162 396 l12 11 l12 -11" fill="none" stroke="#45DDB7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M388 747 l22 12 l-22 12" fill="none" stroke="#A3B4D2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(428,713)"><rect width="348" height="498" rx="22" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><circle cx="42" cy="46" r="22" fill="#58A9FF"/><text x="42" y="55" font-size="26" font-weight="800" fill="#0B1220" text-anchor="middle" >4</text><text x="78" y="56" font-size="28" font-weight="800" fill="#EAF0FA" text-anchor="start" >Neuron fires</text><text x="24" y="100" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >The inside of the cell</text>
<text x="24" y="129" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >becomes less negative</text>
<text x="24" y="158" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >and can fire a spike,</text>
<text x="24" y="187" font-size="23" font-weight="400" fill="#A3B4D2" text-anchor="start" >within milliseconds.</text><line x1="34" y1="390" x2="322" y2="390" stroke="#5873AC" stroke-width="3"/><line x1="34" y1="390" x2="34" y2="228" stroke="#5873AC" stroke-width="3"/><path d="M34 380 H100 L118 372 L132 258 L154 404 L174 380 H318" fill="none" stroke="#FF8F7A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="74" y="424" width="46" height="12" rx="6" fill="#58A9FF"/><text x="97" y="462" font-size="21" font-weight="700" fill="#58A9FF" text-anchor="middle" >light pulse</text><text x="148" y="266" font-size="22" font-weight="700" fill="#FF8F7A" text-anchor="start" >spike</text><text x="44" y="240" font-size="21" font-weight="600" fill="#A3B4D2" text-anchor="start" >voltage</text><text x="322" y="462" font-size="21" font-weight="600" fill="#A3B4D2" text-anchor="end" >time: ms</text></g><text x="40" y="1273" font-size="22" font-weight="400" fill="#EAF0FA" text-anchor="start" >In frog eggs the channel opened within about 0.2 milliseconds.</text>
<text x="40" y="1302" font-size="22" font-weight="400" fill="#EAF0FA" text-anchor="start" >In neurons, blue light controls firing with millisecond precision.</text><text x="40" y="1345" font-size="20" font-weight="400" fill="#A3B4D2" text-anchor="start" >Simplified drawing: shapes and sizes are not to scale. Sources:</text>
<text x="40" y="1372" font-size="20" font-weight="400" fill="#A3B4D2" text-anchor="start" >FACTS.md, section 4.</text></g>
</svg>
