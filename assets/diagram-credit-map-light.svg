<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2914" width="800" height="2914" role="img" aria-labelledby="t d">
<title id="t">Where the credit sits: who the Nobel committee names</title>
<desc id="d">A neutral map of the people the Nobel committee names for the 2026 Medicine prize. Three prize winners, Peter Hegemann, Georg Nagel and Karl Deisseroth, are shown with what the committee says they did and with arrows for who sent genes to whom. Below them are the other people the committee&#x27;s texts name, such as Ernst Bamberg, Edward Boyden, Feng Zhang and Gero Miesenböck, then the 2013 Brain Prize and 2021 Lasker winners and the three-person rule. It lists what the sources say and does not rank anyone.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<g font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<rect width="800" height="2914" rx="28" fill="#F4F7FC"/><rect x="1.5" y="1.5" width="797" height="2911" rx="27" fill="none" stroke="#C6D3EA" stroke-width="3"/><text x="40" y="78" font-size="38" font-weight="800" fill="#14213D" text-anchor="start" >Where the credit sits</text><text x="40" y="118" font-size="24" font-weight="400" fill="#44557A" text-anchor="start" >A map of what the sources write about who did what. It</text>
<text x="40" y="149" font-size="24" font-weight="400" fill="#44557A" text-anchor="start" >does not rank anyone.</text><rect x="24" y="210" width="8" height="40" rx="4" fill="#A85900"/><text x="46" y="240" font-size="29" font-weight="800" fill="#14213D" text-anchor="start" >The prize: three people</text><text x="46" y="268" font-size="22" font-weight="400" fill="#44557A" text-anchor="start" >The Nobel committee’s citation: “for their discoveries</text>
<text x="46" y="297" font-size="22" font-weight="400" fill="#44557A" text-anchor="start" >concerning light-gated ion channels and optogenetics.”</text>
<rect x="24" y="344" width="752" height="226" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="360" width="6" height="194" rx="3" fill="#A85900"/><text x="50" y="392" font-size="28" font-weight="800" fill="#14213D" text-anchor="start" >Peter Hegemann</text><text x="50" y="422" font-size="21" font-weight="600" fill="#A85900" text-anchor="start" >Max Planck Institute for Biochemistry (prize work); Humboldt</text>
<text x="50" y="449" font-size="21" font-weight="600" fill="#A85900" text-anchor="start" >University of Berlin</text><text x="50" y="483" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Asked why an alga reacts to light so fast. Proposed that one</text>
<text x="50" y="513" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >protein is both light sensor and channel. His group found the</text>
<text x="50" y="543" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >genes.</text>
<path d="M68 572 v22 m0 0 l-9 -9 m9 9 l9 -9" fill="none" stroke="#44557A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="590" font-size="21" font-weight="500" fill="#44557A" text-anchor="start" >sent two algal genes to test</text>
<rect x="24" y="616" width="752" height="226" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="632" width="6" height="194" rx="3" fill="#A85900"/><text x="50" y="664" font-size="28" font-weight="800" fill="#14213D" text-anchor="start" >Georg Nagel</text><text x="50" y="694" font-size="21" font-weight="600" fill="#A85900" text-anchor="start" >Max Planck Institute for Biophysics (prize work); University of</text>
<text x="50" y="721" font-size="21" font-weight="600" fill="#A85900" text-anchor="start" >Würzburg</text><text x="50" y="755" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Put the genes into frog eggs and showed the proteins are</text>
<text x="50" y="785" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >light-gated channels (2002, 2003). Provided the ChR2 clone</text>
<text x="50" y="815" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >used in neurons.</text>
<path d="M68 844 v22 m0 0 l-9 -9 m9 9 l9 -9" fill="none" stroke="#44557A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="862" font-size="21" font-weight="500" fill="#44557A" text-anchor="start" >sent the ChR2 clone after an email request</text>
<rect x="24" y="888" width="752" height="169" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="904" width="6" height="137" rx="3" fill="#A85900"/><text x="50" y="936" font-size="28" font-weight="800" fill="#14213D" text-anchor="start" >Karl Deisseroth</text><text x="50" y="966" font-size="21" font-weight="600" fill="#A85900" text-anchor="start" >Stanford University; Howard Hughes Medical Institute</text><text x="50" y="1000" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >His lab first showed ChR2 firing neurons with blue light</text>
<text x="50" y="1030" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >(2005), and in 2007 used optical fibres in living mice.</text>
<rect x="24" y="1083" width="8" height="40" rx="4" fill="#1A62D3"/><text x="46" y="1113" font-size="29" font-weight="800" fill="#14213D" text-anchor="start" >Also named in the committee’s texts</text><text x="46" y="1141" font-size="22" font-weight="400" fill="#44557A" text-anchor="start" >People the scientific background names. None of them is a</text>
<text x="46" y="1170" font-size="22" font-weight="400" fill="#44557A" text-anchor="start" >laureate.</text>
<rect x="24" y="1217" width="752" height="167" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="1233" width="6" height="135" rx="3" fill="#1A62D3"/><text x="50" y="1263" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >Ernst Bamberg</text><text x="50" y="1293" font-size="21" font-weight="600" fill="#1A62D3" text-anchor="start" >Co-author of the 2002, 2003 and 2005 papers</text><text x="50" y="1327" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >The committee names him as Nagel’s PhD supervisor and a</text>
<text x="50" y="1357" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >collaborator on both channelrhodopsin papers.</text>
<rect x="24" y="1398" width="752" height="167" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="1414" width="6" height="135" rx="3" fill="#1A62D3"/><text x="50" y="1444" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >Edward Boyden</text><text x="50" y="1474" font-size="21" font-weight="600" fill="#1A62D3" text-anchor="start" >First author of the 2005 paper</text><text x="50" y="1508" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >With Xue Han, led an independent 2007 study that used</text>
<text x="50" y="1538" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >halorhodopsin to silence neurons.</text>
<rect x="24" y="1579" width="752" height="167" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="1595" width="6" height="135" rx="3" fill="#1A62D3"/><text x="50" y="1625" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >Feng Zhang</text><text x="50" y="1655" font-size="21" font-weight="600" fill="#1A62D3" text-anchor="start" >Co-author of the 2005 paper</text><text x="50" y="1689" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Led the 2007 halorhodopsin silencing paper in Deisseroth’s</text>
<text x="50" y="1719" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >lab.</text>
<rect x="24" y="1760" width="752" height="167" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="1776" width="6" height="135" rx="3" fill="#1A62D3"/><text x="50" y="1806" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >Gero Miesenböck</text><text x="50" y="1836" font-size="21" font-weight="600" fill="#1A62D3" text-anchor="start" >Light-sensitive neurons with genes, 2002</text><text x="50" y="1870" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Co-author of the 2006 review that coined the word</text>
<text x="50" y="1900" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >“optogenetics”.</text>
<rect x="24" y="1941" width="752" height="137" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="1957" width="6" height="105" rx="3" fill="#1A62D3"/><text x="50" y="1987" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >Spudich and Takahashi groups</text><text x="50" y="2017" font-size="21" font-weight="600" fill="#1A62D3" text-anchor="start" >Independent discovery</text><text x="50" y="2051" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Identified the same algal genes at about the same time.</text>
<rect x="24" y="2092" width="752" height="167" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="2108" width="6" height="135" rx="3" fill="#1A62D3"/><text x="50" y="2138" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >Pan; Herlitze and Landmesser; Yawo</text><text x="50" y="2168" font-size="21" font-weight="600" fill="#1A62D3" text-anchor="start" >Early independent studies, 2005 to 2006</text><text x="50" y="2202" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Zhuo-Hua Pan restored light responses in mouse retinas.</text>
<text x="50" y="2232" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >The other groups used ChR2 in neurons.</text>
<rect x="24" y="2285" width="8" height="40" rx="4" fill="#07785F"/><text x="46" y="2315" font-size="29" font-weight="800" fill="#14213D" text-anchor="start" >Other prizes and the rule</text><text x="46" y="2343" font-size="22" font-weight="400" fill="#44557A" text-anchor="start" >What the prize pages and news reports say.</text>
<rect x="24" y="2390" width="752" height="134" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="2406" width="6" height="102" rx="3" fill="#07785F"/><text x="50" y="2436" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >2013 Brain Prize: six people</text><text x="50" y="2472" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Ernst Bamberg, Edward Boyden, Karl Deisseroth, Peter</text>
<text x="50" y="2502" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Hegemann, Gero Miesenböck and Georg Nagel.</text>
<rect x="24" y="2538" width="752" height="104" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="2554" width="6" height="72" rx="3" fill="#07785F"/><text x="50" y="2584" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >2021 Lasker Basic Award: three people</text><text x="50" y="2620" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >Karl Deisseroth, Peter Hegemann and Dieter Oesterhelt.</text>
<rect x="24" y="2656" width="752" height="134" rx="18" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><rect x="24" y="2672" width="6" height="102" rx="3" fill="#07785F"/><text x="50" y="2702" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" >The Nobel rule</text><text x="50" y="2738" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >A Nobel Prize is limited to no more than three people</text>
<text x="50" y="2768" font-size="23" font-weight="400" fill="#14213D" text-anchor="start" >(STAT; Nature).</text><text x="40" y="2844" font-size="20" font-weight="400" fill="#44557A" text-anchor="start" >Sources: FACTS.md section 2, the committee’s scientific background,</text>
<text x="40" y="2871" font-size="20" font-weight="400" fill="#44557A" text-anchor="start" >the Brain Prize and Lasker pages.</text></g>
</svg>
