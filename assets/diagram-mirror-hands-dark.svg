<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1124" width="800" height="1124" role="img" aria-labelledby="t d">
<title id="t">Mirror molecules: life uses one hand</title>
<desc id="d">Two hands and an amino acid, each next to its mirror image across a dashed mirror line. Top: a left hand, drawn solid orange, and its mirror image, a right hand, drawn hatched teal. Bottom: a ball-and-stick model of the amino acid alanine: a central carbon atom holding four different groups, a hydrogen atom (H), an amino group (NH2), a carboxylic acid group (COOH) and a methyl group (CH3), in a tetrahedral shape. On the left is L-alanine, the form found in the proteins of living things; on the right its mirror image, D-alanine. The two have the same atoms joined the same way, but they cannot be laid on top of each other, like a left and a right hand. Chemists call such molecules chiral, and the two forms enantiomers. Life uses one hand: the amino acids in our proteins are the L form. Our own drawing, not to scale.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
