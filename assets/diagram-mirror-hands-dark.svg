<text x="44" y="964" font-size="21" font-weight="400" fill="#EEE6D6" text-anchor="start" >chiral, and the two forms enantiomers.</text><text x="44" y="1002" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >Like hands, amino acids come in two mirror forms, but only one is found</text>
<text x="44" y="1028" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >in the proteins in your cells. Source: the Nobel Committee’s popular</text>
