<text x="44" y="1320" font-size="21" font-weight="400" fill="#EEE6D6" text-anchor="start" >not explain why the lead grows; how the reaction amplifies it is</text>
<text x="44" y="1348" font-size="21" font-weight="400" fill="#EEE6D6" text-anchor="start" >still debated.</text><text x="44" y="1386" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >ee, the lead of one hand: % of one hand minus % of the other; 0% is an even</text>
<text x="44" y="1412" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >mix, 100% is one hand only. Numbers: Soai and co-workers, 2003, as given</text>
<text x="44" y="1438" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >in the Nobel Committee’s scientific background. The tokens are symbols,</text>
<text x="44" y="1464" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >not real molecules. Our own drawing.</text></g>
