<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1534" width="800" height="1534" role="img" aria-labelledby="t d">
<title id="t">Soai’s copier: a molecule that makes copies of its own hand</title>
<desc id="d">How Soai&#x27;s reaction copies one hand, and his group&#x27;s 2003 numbers. Top, the copier: grey dots are a simple ingredient with no hand; a molecule with one hand, solid orange, turns an ingredient into a new molecule of its own hand, so 1 molecule becomes 2, and 2 become 4. Middle, a bar chart of the lead of one hand (ee) in three runs in a row, Soai&#x27;s group, 2003: the start, 0.00005 per cent, too small to draw (one hand ahead by about one molecule in two million); after run 1, 57 per cent; after run 2, 99 per cent; after run 3, more than 99.5 per cent. Bottom: with no head start at all, 37 runs: 19 gave one hand and 18 the other, with a lead between 15 and 91 per cent, never one hand only; the hand was chosen at random. Why the reaction amplifies the lead is still debated. The tokens are symbols, not real molecules. Our own drawing.</desc>
