<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
<title id="t">nobel-2026-lab: hands-on demos of the 2026 Nobel Prizes</title>
<desc id="d">nobel-2026-lab. Educational demos of this year&#x27;s Nobel Prizes. A fibre tip shines blue light into a block of tissue, the light fades with depth, a warm halo of heat sits at the tip, and a trace of nerve spikes runs below. Toy models, not research.</desc>
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}.warm{animation:warm 6s ease-in-out infinite}@keyframes warm{0%,100%{opacity:.9}50%{opacity:.55}}.spk{stroke-dasharray:220 1180;stroke-dashoffset:220;animation:draw 7s linear infinite}@keyframes draw{0%{stroke-dashoffset:220}100%{stroke-dashoffset:-1180}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
