<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
<title id="t">Nobel 2026 Lab: hands-on demos of this year’s Nobel Prizes</title>
<desc id="d">Nobel 2026 Lab. Hands-on demos of this year’s Nobel Prizes, one card per prize. Medicine: a nerve cell lit by a pulse of blue light from the tip of an optical fibre, with a spike running down its axon. Physics: strings of light sensors hanging in dark ice, a particle track with a cone of blue Cherenkov light behind it, and the sensors near the track lit up. A third, dashed slot holds the prizes still to come: Chemistry on 7 October and Economics on 12 October. Toy models, not research, not for lab or clinical use. Videos made with showtime, an open-source video studio for coding agents.</desc>
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.lit{animation:lit 5s ease-in-out infinite}@keyframes lit{0%,100%{opacity:.85}50%{opacity:.35}}.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.62}}.spk{stroke-dasharray:14 186;stroke-dashoffset:-40;animation:spk 5s linear infinite}@keyframes spk{0%{stroke-dashoffset:14}100%{stroke-dashoffset:-186}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
