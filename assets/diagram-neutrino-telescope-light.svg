<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1493" width="800" height="1493" role="img" aria-labelledby="t d">
<title id="t">How a neutrino telescope works, in four steps</title>
<desc id="d">A four-panel drawing of how a neutrino telescope works. Panel 1: a neutrino from space crosses the Earth and the ice at the South Pole without touching anything, which is what almost always happens. Panel 2: very rarely it hits a nucleus in the ice and makes either a muon, which leaves a long track, or a shower, a ball of light. Panel 3: the charged particles move faster than light travels in ice and give off a cone of blue Cherenkov light. Panel 4: light sensors on vertical strings record when and how much light arrives, the first sensors in red and the last in blue, and the pattern gives the direction and the energy. A simplified drawing: shapes, sizes and angles are not to scale.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<g font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<defs><linearGradient id="iceg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F2FD"/><stop offset="1" stop-color="#D2E2F6"/></linearGradient><radialGradient id="ball" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2A74E8" stop-opacity=".9"/><stop offset=".55" stop-color="#2A74E8" stop-opacity=".35"/><stop offset="1" stop-color="#2A74E8" stop-opacity="0"/></radialGradient><linearGradient id="ckv" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2A74E8" stop-opacity=".55"/><stop offset="1" stop-color="#2A74E8" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1493" rx="28" fill="#F4F7FC"/><rect x="1.5" y="1.5" width="797" height="1490" rx="27" fill="none" stroke="#C6D3EA" stroke-width="3"/><text x="40" y="78" font-size="38" font-weight="800" fill="#14213D" text-anchor="start" >How a neutrino telescope works</text><text x="40" y="118" font-size="26" font-weight="500" fill="#44557A" text-anchor="start" >Through the Earth, a rare hit, a cone of light</text><g transform="translate(24,156)"><rect width="348" height="578" rx="22" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><circle cx="42" cy="46" r="22" fill="#1A62D3"/><text x="42" y="55" font-size="26" font-weight="800" fill="#F4F7FC" text-anchor="middle" >1</text><text x="78" y="56" font-size="28" font-weight="800" fill="#14213D" text-anchor="start" >Passes through</text><text x="24" y="100" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >A neutrino from space</text>
<text x="24" y="129" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >has no electric charge.</text>
<text x="24" y="158" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >Almost always, it</text>
<text x="24" y="187" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >crosses the whole Earth</text>
<text x="24" y="216" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >and the ice without</text>
<text x="24" y="245" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >touching anything.</text><circle cx="174" cy="396" r="96" fill="#EDE3D2" stroke="#A88D60" stroke-width="2.5"/><path d="M112.8 470 A96 96 0 0 0 235.2 470 Z" fill="#F8FBFF" stroke="#93AFD8" stroke-width="2.5"/><text x="208" y="390" font-size="22" font-weight="700" fill="#44557A" text-anchor="middle" >Earth</text><line x1="36" y1="280" x2="213.8" y2="541.7" stroke="#5A45C4" stroke-width="4.5" stroke-dasharray="10 8" stroke-linecap="round"/><polygon points="219.4,550.0 218.5,528.8 200.1,541.4" fill="#5A45C4"/><text x="60" y="296" font-size="22" font-weight="700" fill="#5A45C4" text-anchor="start" >neutrino</text><text x="24" y="542" font-size="21" font-weight="700" fill="#44557A" text-anchor="start" >South Pole ice</text><line x1="96" y1="520" x2="140.4" y2="480" stroke="#44557A" stroke-width="2"/></g><path d="M388 190 l22 12 l-22 12" fill="none" stroke="#44557A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(428,156)"><rect width="348" height="578" rx="22" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><circle cx="42" cy="46" r="22" fill="#1A62D3"/><text x="42" y="55" font-size="26" font-weight="800" fill="#F4F7FC" text-anchor="middle" >2</text><text x="78" y="56" font-size="28" font-weight="800" fill="#14213D" text-anchor="start" >A rare hit</text><text x="24" y="100" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >Very rarely, one hits a</text>
<text x="24" y="129" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >nucleus in the ice. That</text>
<text x="24" y="158" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >makes a muon, which</text>
<text x="24" y="187" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >leaves a long track, or a</text>
<text x="24" y="216" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >shower, a ball of light.</text><rect x="16" y="272" width="316" height="288" rx="16" fill="url(#iceg)" stroke="#93AFD8" stroke-width="2"/><text x="318" y="298" font-size="20" font-weight="600" fill="#44557A" text-anchor="end" >ice</text><line x1="40" y1="288" x2="80.4" y2="365.4" stroke="#5A45C4" stroke-width="4.5" stroke-dasharray="10 8" stroke-linecap="round"/><line x1="86" y1="376" x2="135.1" y2="469.9" stroke="#C23A22" stroke-width="6" stroke-linecap="round"/><polygon points="140.7,480.6 142.4,457.1 120.4,468.6" fill="#C23A22"/><polygon points="101.0,376.0 92.2,378.6 96.6,386.6 88.6,382.2 86.0,391.0 83.4,382.2 75.4,386.6 79.8,378.6 71.0,376.0 79.8,373.4 75.4,365.4 83.4,369.8 86.0,361.0 88.6,369.8 96.6,365.4 92.2,373.4" fill="#A85900"/><text x="66" y="383" font-size="21" font-weight="700" fill="#A85900" text-anchor="end" >hit</text><text x="30" y="524" font-size="22" font-weight="700" fill="#C23A22" text-anchor="start" >muon:</text><text x="30" y="548" font-size="21" font-weight="500" fill="#14213D" text-anchor="start" >a long track</text><line x1="196" y1="288" x2="236.4" y2="365.4" stroke="#5A45C4" stroke-width="4.5" stroke-dasharray="10 8" stroke-linecap="round"/><circle cx="248" cy="406" r="58" fill="url(#ball)"/><polygon points="257.0,376.0 248.2,378.6 252.6,386.6 244.6,382.2 242.0,391.0 239.4,382.2 231.4,386.6 235.8,378.6 227.0,376.0 235.8,373.4 231.4,365.4 239.4,369.8 242.0,361.0 244.6,369.8 252.6,365.4 248.2,373.4" fill="#A85900"/><text x="186" y="524" font-size="22" font-weight="700" fill="#1A62D3" text-anchor="start" >shower:</text><text x="186" y="548" font-size="21" font-weight="500" fill="#14213D" text-anchor="start" >a ball of light</text><line x1="174" y1="312" x2="174" y2="498" stroke="#93AFD8" stroke-width="2" stroke-dasharray="4 6"/></g><g transform="translate(24,764)"><rect width="348" height="549" rx="22" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/>