<text x="24" y="187" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >off a cone of blue light,</text>
<text x="24" y="216" font-size="23" font-weight="400" fill="#44557A" text-anchor="start" >called Cherenkov light.</text><rect x="16" y="243" width="316" height="288" rx="16" fill="url(#iceg)" stroke="#93AFD8" stroke-width="2"/><text x="318" y="269" font-size="20" font-weight="600" fill="#44557A" text-anchor="end" >ice</text><polygon points="236,371 128,259 128,483" fill="url(#ckv)"/><line x1="236" y1="371" x2="128" y2="259" stroke="#1A62D3" stroke-width="3.5" stroke-linecap="round"/><line x1="195.0" y1="328.4" x2="213.7" y2="310.4" stroke="#1A62D3" stroke-width="3.5" stroke-linecap="round"/><polygon points="219.4,304.8 205.6,307.8 216.0,318.5" fill="#1A62D3"/><line x1="151.8" y1="283.6" x2="170.5" y2="265.6" stroke="#1A62D3" stroke-width="3.5" stroke-linecap="round"/><polygon points="176.2,260.0 162.4,263.0 172.8,273.7" fill="#1A62D3"/><line x1="236" y1="371" x2="128" y2="483" stroke="#1A62D3" stroke-width="3.5" stroke-linecap="round"/><line x1="195.0" y1="413.6" x2="213.7" y2="431.6" stroke="#1A62D3" stroke-width="3.5" stroke-linecap="round"/><polygon points="219.4,437.2 216.0,423.5 205.6,434.2" fill="#1A62D3"/><line x1="151.8" y1="458.4" x2="170.5" y2="476.4" stroke="#1A62D3" stroke-width="3.5" stroke-linecap="round"/><polygon points="176.2,482.0 172.8,468.3 162.4,479.0" fill="#1A62D3"/><line x1="30" y1="371" x2="236" y2="371" stroke="#C23A22" stroke-width="6" stroke-linecap="round"/><circle cx="236" cy="371" r="9" fill="#C23A22"/><polygon points="270.0,371.0 254.0,361.1 254.0,380.9" fill="#C23A22"/><text x="30" y="355" font-size="22" font-weight="700" fill="#C23A22" text-anchor="start" >muon</text><text x="318" y="517" font-size="22" font-weight="700" fill="#1A62D3" text-anchor="end" >Cherenkov light</text></g><path d="M388 798 l22 12 l-22 12" fill="none" stroke="#44557A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(428,764)"><rect width="348" height="549" rx="22" fill="#FFFFFF" stroke="#C6D3EA" stroke-width="2"/><circl