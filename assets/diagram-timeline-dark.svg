<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2255" width="800" height="2255" role="img" aria-labelledby="t d">
<title id="t">From algae to a Nobel Prize: a timeline, 1971 to 2026</title>
<desc id="d">A vertical timeline in ten steps from 1971 to 2026: a light-driven protein in a microbe (1971), Hegemann&#x27;s idea of a one-protein light-gated channel (early 1990s), Crick&#x27;s remark that light would be the ideal signal (1999), channelrhodopsin-1 (2002) and channelrhodopsin-2 (2003), the first neurons fired with blue light (2004 to 2005), the word optogenetics and fibre optics in living mice (2006 to 2007), early prizes (2010 to 2013), partial sight recovery in one patient (2021), and the 2026 Nobel Prize.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<g font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<rect width="800" height="2255" rx="28" fill="#0B1220"/><rect x="1.5" y="1.5" width="797" height="2252" rx="27" fill="none" stroke="#2A3B61" stroke-width="3"/><text x="40" y="78" font-size="38" font-weight="800" fill="#EAF0FA" text-anchor="start" >From algae to a Nobel Prize</text><text x="40" y="118" font-size="26" font-weight="500" fill="#A3B4D2" text-anchor="start" >Ten steps, 1971 to 2026</text><circle cx="49" cy="156" r="9" fill="#45DDB7"/><text x="66" y="164" font-size="22" font-weight="500" fill="#A3B4D2" text-anchor="start" >Discoveries and ideas</text><circle cx="343.178" cy="156" r="9" fill="#58A9FF"/><text x="360.178" y="164" font-size="22" font-weight="500" fill="#A3B4D2" text-anchor="start" >The tool for neurons</text><circle cx="49" cy="190" r="9" fill="#FFB84D"/><text x="66" y="198" font-size="22" font-weight="500" fill="#A3B4D2" text-anchor="start" >Prizes and medicine</text><line x1="46" y1="262" x2="46" y2="1971" stroke="#2D3F66" stroke-width="5" stroke-linecap="round"/><rect x="84" y="232" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="250" width="6" height="131" rx="3" fill="#45DDB7"/><text x="108" y="278" font-size="29" font-weight="800" fill="#45DDB7" text-anchor="start" >1971</text><text x="108" y="314" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Dieter Oesterhelt and Walther Stoeckenius find</text>
<text x="108" y="345" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >bacteriorhodopsin, a light-driven protein, in a</text>
<text x="108" y="376" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >salt-loving microbe.</text>
<rect x="84" y="415" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="433" width="6" height="131" rx="3" fill="#45DDB7"/><text x="108" y="461" font-size="29" font-weight="800" fill="#45DDB7" text-anchor="start" >Early 1990s</text><text x="108" y="497" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Peter Hegemann asks why an alga reacts to light so</text>
<text x="108" y="528" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >fast. He proposes that one protein both catches light</text>
<text x="108" y="559" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >and forms a channel. The idea meets scepticism.</text>
<rect x="84" y="598" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="616" width="6" height="131" rx="3" fill="#45DDB7"/><text x="108" y="644" font-size="29" font-weight="800" fill="#45DDB7" text-anchor="start" >1999</text><text x="108" y="680" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Francis Crick writes that the ideal signal for</text>
<text x="108" y="711" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >switching neurons on and off would be light, and</text>
<text x="108" y="742" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >calls the idea “rather far-fetched”.</text>
<rect x="84" y="781" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="799" width="6" height="131" rx="3" fill="#45DDB7"/><text x="108" y="827" font-size="29" font-weight="800" fill="#45DDB7" text-anchor="start" >2002</text><text x="108" y="863" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Georg Nagel, Hegemann, Ernst Bamberg and</text>
<text x="108" y="894" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >colleagues show in frog eggs that</text>
<text x="108" y="925" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >channelrhodopsin-1 is a light-gated channel.</text>
<rect x="84" y="964" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="982" width="6" height="131" rx="3" fill="#45DDB7"/><text x="108" y="1010" font-size="29" font-weight="800" fill="#45DDB7" text-anchor="start" >2003</text><text x="108" y="1046" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Channelrhodopsin-2 opens directly in light and works</text>
<text x="108" y="1077" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >in mammalian cells. The paper says it “should</text>
<text x="108" y="1108" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >become a useful tool”.</text>
<rect x="84" y="1147" width="694" height="198" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="1165" width="6" height="162" rx="3" fill="#58A9FF"/><text x="108" y="1193" font-size="29" font-weight="800" fill="#58A9FF" text-anchor="start" >2004 to 2005</text><text x="108" y="1229" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >4 August 2004: the first neuron carrying the protein</text>
<text x="108" y="1260" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >fires to blue light. In 2005 Boyden, Zhang, Bamberg,</text>
<text x="108" y="1291" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Nagel and Deisseroth report millisecond control of</text>
<text x="108" y="1322" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >nerve cells.</text>
<rect x="84" y="1361" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="1379" width="6" height="131" rx="3" fill="#58A9FF"/><text x="108" y="1407" font-size="29" font-weight="800" fill="#58A9FF" text-anchor="start" >2006 to 2007</text><text x="108" y="1443" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >The word “optogenetics” is coined in a 2006 review.</text>
<text x="108" y="1474" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >In 2007 Deisseroth’s lab uses an optical fibre to</text>
<text x="108" y="1505" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >switch on nerve cells in living mice.</text>
<rect x="84" y="1544" width="694" height="167" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="1562" width="6" height="131" rx="3" fill="#FFB84D"/><text x="108" y="1590" font-size="29" font-weight="800" fill="#FFB84D" text-anchor="start" >2010 to 2013</text><text x="108" y="1626" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Nature Methods names optogenetics its Method of</text>
<text x="108" y="1657" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >the Year 2010. The 2013 Brain Prize goes to six</text>
<text x="108" y="1688" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >pioneers.</text>
<rect x="84" y="1727" width="694" height="198" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="1745" width="6" height="162" rx="3" fill="#FFB84D"/><text x="108" y="1773" font-size="29" font-weight="800" fill="#FFB84D" text-anchor="start" >2021</text><text x="108" y="1809" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >One blind patient regains partial sight with</text>
<text x="108" y="1840" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >optogenetic gene therapy and light-projecting</text>
<text x="108" y="1871" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >goggles. The Lasker Award goes to Deisseroth,</text>
<text x="108" y="1902" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Hegemann and Oesterhelt.</text>
<rect x="84" y="1941" width="694" height="198" rx="18" fill="#121C32" stroke="#2A3B61" stroke-width="2"/><rect x="84" y="1959" width="6" height="162" rx="3" fill="#FFB84D"/><text x="108" y="1987" font-size="29" font-weight="800" fill="#FFB84D" text-anchor="start" >2026</text><text x="108" y="2023" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >9 September: the FDA accepts an optogenetic gene</text>
<text x="108" y="2054" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >therapy for review; it is not yet approved. 5 October:</text>
<text x="108" y="2085" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >the Nobel Prize goes to Deisseroth, Hegemann and</text>
<text x="108" y="2116" font-size="24" font-weight="400" fill="#EAF0FA" text-anchor="start" >Nagel.</text><circle cx="46" cy="262" r="13" fill="#45DDB7" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="445" r="13" fill="#45DDB7" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="628" r="13" fill="#45DDB7" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="811" r="13" fill="#45DDB7" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="994" r="13" fill="#45DDB7" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="1177" r="13" fill="#58A9FF" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="1391" r="13" fill="#58A9FF" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="1574" r="13" fill="#FFB84D" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="1757" r="13" fill="#FFB84D" stroke="#0B1220" stroke-width="5"/><circle cx="46" cy="1971" r="13" fill="#FFB84D" stroke="#0B1220" stroke-width="5"/><text x="40" y="2193" font-size="21" font-weight="400" fill="#A3B4D2" text-anchor="start" >Every step is sourced in FACTS.md, section 3. Educational demo,</text>
<text x="40" y="2221" font-size="21" font-weight="400" fill="#A3B4D2" text-anchor="start" >not research.</text></g>
</svg>
