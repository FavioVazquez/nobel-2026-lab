<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1480" width="800" height="1480" role="img" aria-labelledby="t d">
<title id="t">Kagan’s bend: a mixed-hand catalyst beats a straight line</title>
<desc id="d">Kagan&#x27;s non-linear effect in three steps and a curve. Step 1: the chiral part of a catalyst, the ligand, is a mix of 75 per cent one hand and 25 per cent the mirror hand, an excess (ee) of 50 per cent. Step 2: each metal atom holds two ligands, which pair up by chance: 56 per cent one-hand pairs, 38 per cent mixed pairs and 6 per cent mirror pairs. Step 3: the mixed pairs barely work and sit out, so the reaction is driven by the other two in the ratio 56 to 6, which is 90 to 10: the product has an 80 per cent excess of one hand. A straight line would have given 50 per cent. Below, a sketch of the curve, shape only: the product&#x27;s ee against the ligand&#x27;s ee, with the straight line that chemists expected, the curve bulging above it (a positive non-linear effect, with the example at 50 per cent in and 80 per cent out) and a curve that sags below it when the mixed pair works faster (a negative effect). The numbers follow the worked example in the Nobel Committee&#x27;s popular science background. Our own drawing.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<g font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#2b8a8f"/><line x1="1.5" y1="0" x2="1.5" y2="9" stroke="#10141B" stroke-width="2.6" stroke-opacity=".7"/></pattern><pattern id="ruled" width="32" height="32" patternUnits="userSpaceOnUse"><line x1="0" y1="31" x2="32" y2="31" stroke="#1C2330" stroke-width="1.5"/></pattern></defs><rect width="800" height="1480" rx="28" fill="#10141B"/><rect x="8" y="8" width="784" height="1464" rx="22" fill="url(#ruled)"/><line x1="22" y1="8" x2="22" y2="1472" stroke="#c4622d" stroke-opacity=".28" stroke-width="2"/><rect x="1.5" y="1.5" width="797" height="1477" rx="27" fill="none" stroke="#323C4C" stroke-width="3"/><text x="44" y="78" font-size="38" font-weight="800" fill="#EEE6D6" text-anchor="start" >Kagan’s bend</text><text x="44" y="118" font-size="25" font-weight="500" fill="#ABA394" text-anchor="start" >A catalyst made from a mix of both hands does not add</text>
<text x="44" y="150" font-size="25" font-weight="500" fill="#ABA394" text-anchor="start" >up in a straight line</text><rect x="36" y="186" width="728" height="176" rx="20" fill="#171D27" stroke="#323C4C" stroke-width="2"/><circle cx="352" cy="226" r="21" fill="#EEE6D6"/><text x="352" y="234.5" font-size="24" font-weight="800" fill="#171D27" text-anchor="middle" >1</text><text x="384" y="235" font-size="26" font-weight="800" fill="#EEE6D6" text-anchor="start" >Mix the hands</text><text x="334" y="274" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >The chiral part of the catalyst, the</text>
<text x="334" y="301" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >ligand, is 75% one hand and 25% the</text>
<text x="334" y="328" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >mirror hand: an excess (ee) of 50%.</text><circle cx="106" cy="220" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="150" cy="220" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="194" cy="220" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="238" cy="220" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="282" cy="220" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="106" cy="250" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="150" cy="250" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="194" cy="250" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="238" cy="250" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="282" cy="250" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="106" cy="280" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="150" cy="280" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="194" cy="280" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="238" cy="280" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="282" cy="280" r="12" fill="#c4622d" stroke="#EEE6D6" stroke-width="2"/><circle cx="106" cy="310" r="12" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2"/><circle cx="150" cy="310" r="12" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2"/><circle cx="194" cy="310" r="12" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2"/><circle cx="238" cy="310" r="12" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2"/><circle cx="282" cy="310" r="12" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2"/><text x="194" y="356" font-size="22" font-weight="800" fill="#EEE6D6" text-anchor="middle" >75 : 25</text><rect x="36" y="378" width="728" height="176" rx="20" fill="#171D27" stroke="#323C4C" stroke-width="2"/><circle cx="352" cy="418" r="21" fill="#EEE6D6"/><text x="352" y="426.5" font-size="24" font-weight="800" fill="#171D27" text-anchor="middle" >2</text><text x="384" y="427" font-size="26" font-weight="800" fill="#EEE6D6" text-anchor="start" >They pair up</text><text x="334" y="466" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >Each metal atom (M) holds two ligands,</text>
<text x="334" y="493" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >chosen by chance: 56% one-hand pairs,</text>
<text x="334" y="520" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >38% mixed pairs, 6% mirror pairs.</text><g><circle cx="84" cy="448" r="15" fill="#c4622d" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="132" cy="448" r="15" fill="#c4622d" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="108" cy="448" r="14" fill="#202835" stroke="#EEE6D6" stroke-width="2.5"/><text x="108" y="454" font-size="16" font-weight="800" fill="#EEE6D6" text-anchor="middle" >M</text></g><text x="108" y="496" font-size="23" font-weight="800" fill="#EEE6D6" text-anchor="middle" >56%</text><g><circle cx="170" cy="448" r="15" fill="#c4622d" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="218" cy="448" r="15" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="194" cy="448" r="14" fill="#202835" stroke="#EEE6D6" stroke-width="2.5"/><text x="194" y="454" font-size="16" font-weight="800" fill="#EEE6D6" text-anchor="middle" >M</text></g><text x="194" y="496" font-size="23" font-weight="800" fill="#EEE6D6" text-anchor="middle" >38%</text><text x="194" y="522" font-size="18" font-weight="700" fill="#ABA394" text-anchor="middle" >mixed</text><g><circle cx="256" cy="448" r="15" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="304" cy="448" r="15" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="280" cy="448" r="14" fill="#202835" stroke="#EEE6D6" stroke-width="2.5"/><text x="280" y="454" font-size="16" font-weight="800" fill="#EEE6D6" text-anchor="middle" >M</text></g><text x="280" y="496" font-size="23" font-weight="800" fill="#EEE6D6" text-anchor="middle" >6%</text><rect x="36" y="570" width="728" height="176" rx="20" fill="#171D27" stroke="#323C4C" stroke-width="2"/><circle cx="352" cy="610" r="21" fill="#EEE6D6"/><text x="352" y="618.5" font-size="24" font-weight="800" fill="#171D27" text-anchor="middle" >3</text><text x="384" y="619" font-size="26" font-weight="800" fill="#EEE6D6" text-anchor="start" >Mixed pairs sit out</text><text x="334" y="658" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >The mixed pair barely works. The other</text>
<text x="334" y="685" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >two drive the reaction, 56 to 6, which is</text>
<text x="334" y="712" font-size="20" font-weight="400" fill="#ABA394" text-anchor="start" >90 to 10: an 80% excess of one hand.</text><g><circle cx="84" cy="614" r="15" fill="#c4622d" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="132" cy="614" r="15" fill="#c4622d" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="108" cy="614" r="14" fill="#202835" stroke="#EEE6D6" stroke-width="2.5"/><text x="108" y="620" font-size="16" font-weight="800" fill="#EEE6D6" text-anchor="middle" >M</text></g><g opacity=".45"><circle cx="170" cy="614" r="15" fill="#8A867F" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="218" cy="614" r="15" fill="#8A867F" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="194" cy="614" r="14" fill="#202835" stroke="#EEE6D6" stroke-width="2.5"/><text x="194" y="620" font-size="16" font-weight="800" fill="#EEE6D6" text-anchor="middle" >M</text></g><line x1="154.0" y1="588.0" x2="234.0" y2="640.0" stroke="#ABA394" stroke-width="3.5" stroke-linecap="round"/><g><circle cx="256" cy="614" r="15" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="304" cy="614" r="15" fill="url(#hatch)" stroke="#EEE6D6" stroke-width="2.5"/><circle cx="280" cy="614" r="14" fill="#202835" stroke="#EEE6D6" stroke-width="2.5"/><text x="280" y="620" font-size="16" font-weight="800" fill="#EEE6D6" text-anchor="middle" >M</text></g><rect x="82" y="660" width="201.6" height="26" fill="#c4622d"/><rect x="283.6" y="660" width="22.4" height="26" fill="url(#hatch)"/><rect x="82" y="660" width="224" height="26" rx="3" fill="none" stroke="#EEE6D6" stroke-width="2.5"/><text x="82" y="714" font-size="21" font-weight="800" fill="#EEE6D6" text-anchor="start" >90 : 10</text><text x="306" y="714" font-size="21" font-weight="800" fill="#EC8A5A" text-anchor="end" >ee 80%</text><rect x="36" y="762" width="728" height="462" rx="20" fill="#171D27" stroke="#323C4C" stroke-width="2"/><text x="64" y="808" font-size="26" font-weight="800" fill="#EEE6D6" text-anchor="start" >The curve</text><rect x="204" y="784" width="132" height="32" rx="16" fill="#202835" stroke="#323C4C" stroke-width="2"/><text x="269.925" y="806" font-size="18" font-weight="800" fill="#ABA394" text-anchor="middle" >shape only</text><rect x="128" y="832" width="360" height="300" fill="#10141B" fill-opacity=".55"/><path d="M128 832 V1132 H488" fill="none" stroke="#EEE6D6" stroke-width="3"/><text x="128" y="1160" font-size="18" font-weight="600" fill="#ABA394" text-anchor="middle" >0%</text><text x="118" y="1138" font-size="18" font-weight="600" fill="#ABA394" text-anchor="end" >0%</text><text x="308" y="1160" font-size="18" font-weight="600" fill="#ABA394" text-anchor="middle" >50%</text><text x="118" y="988" font-size="18" font-weight="600" fill="#ABA394" text-anchor="end" >50%</text><text x="488" y="1160" font-size="18" font-weight="600" fill="#ABA394" text-anchor="middle" >100%</text><text x="118" y="838" font-size="18" font-weight="600" fill="#ABA394" text-anchor="end" >100%</text><text x="308" y="1190" font-size="20" font-weight="700" fill="#EEE6D6" text-anchor="middle" >lead of one hand in the ligand (ee)</text><text x="66" y="982" font-size="20" font-weight="700" fill="#EEE6D6" text-anchor="middle" transform="rotate(-90 66 982)">lead in the product (ee)</text><path d="M128.0 1132.0 L134.0 1129.1 L140.0 1126.3 L146.0 1123.4 L152.0 1120.5 L158.0 1117.7 L164.0 1114.8 L170.0 1111.9 L176.0 1109.0 L182.0 1106.0 L188.0 1103.1 L194.0 1100.1 L200.0 1097.1 L206.0 1094.1 L212.0 1091.0 L218.0 1088.0 L224.0 1084.8 L230.0 1081.7 L236.0 1078.5 L242.0 1075.3 L248.0 1072.0 L254.0 1068.7 L260.0 1065.3 L266.0 1061.9 L272.0 1058.4 L278.0 1054.8 L284.0 1051.2 L290.0 1047.5 L296.0 1043.8 L302.0 1039.9 L308.0 1036.0 L314.0 1032.0 L320.0 1027.9 L326.0 1023.7 L332.0 1019.4 L338.0 1014.9 L344.0 1010.4 L350.0 1005.7 L356.0 1000.9 L362.0 995.9 L368.0 990.8 L374.0 985.5 L380.0 980.1 L386.0 974.5 L392.0 968.6 L398.0 962.6 L404.0 956.3 L410.0 949.8 L416.0 943.0 L422.0 936.0 L428.0 928.6 L434.0 920.9 L440.0 912.9 L446.0 904.5 L452.0 895.7 L458.0 886.4 L464.0 876.7 L470.0 866.4 L476.0 855.6 L482.0 844.1 L488.0 832.0" fill="none" stroke="#8A867F" stroke-width="3.5" stroke-dasharray="2 7" stroke-linecap="round"/><line x1="128" y1="1132" x2="488" y2="832" stroke="#EEE6D6" stroke-width="3" stroke-dasharray="12 8"/><path d="M128.0 1132.0 L134.0 1122.0 L140.0 1112.0 L146.0 1102.1 L152.0 1092.2 L158.0 1082.3 L164.0 1072.6 L170.0 1062.9 L176.0 1053.4 L182.0 1044.0 L188.0 1034.7 L194.0 1025.6 L200.0 1016.6 L206.0 1007.8 L212.0 999.2 L218.0 990.8 L224.0 982.6 L230.0 974.6 L236.0 966.9 L242.0 959.3 L248.0 952.0 L254.0 944.9 L260.0 938.1 L266.0 931.5 L272.0 925.1 L278.0 919.0 L284.0 913.1 L290.0 907.5 L296.0 902.1 L302.0 896.9 L308.0 892.0 L314.0 887.3 L320.0 882.9 L326.0 878.6 L332.0 874.6 L338.0 870.9 L344.0 867.3 L350.0 863.9 L356.0 860.8 L362.0 857.8 L368.0 855.1 L374.0 852.5 L380.0 850.1 L386.0 847.9 L392.0 845.9 L398.0 844.0 L404.0 842.3 L410.0 840.7 L416.0 839.3 L422.0 838.0 L428.0 836.9 L434.0 835.9 L440.0 835.0 L446.0 834.3 L452.0 833.7 L458.0 833.1 L464.0 832.7 L470.0 832.4 L476.0 832.2 L482.0 832.0 L488.0 832.0" fill="none" stroke="#c4622d" stroke-width="5.5" stroke-linecap="round"/><line x1="308.0" y1="982.0" x2="308.0" y2="892.0" stroke="#EEE6D6" stroke-width="2" stroke-dasharray="3 5"/><circle cx="308.0" cy="982.0" r="7" fill="#171D27" stroke="#ABA394" stroke-width="3"/><circle cx="308.0" cy="892.0" r="9" fill="#c4622d" stroke="#171D27" stroke-width="3"/><text x="522" y="844" font-size="21" font-weight="800" fill="#EC8A5A" text-anchor="start" >Kagan’s bend</text><text x="522" y="869" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >The mixed pair is slow:</text>
<text x="522" y="893" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >the product beats the</text>
<text x="522" y="917" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >straight line. Our</text>
<text x="522" y="941" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >example: 50% in, 80%</text>
<text x="522" y="965" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >out.</text><text x="522" y="1005" font-size="21" font-weight="800" fill="#EEE6D6" text-anchor="start" >Straight line</text><text x="522" y="1030" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >What chemists</text>
<text x="522" y="1054" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >expected: 50% in, 50%</text>
<text x="522" y="1078" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >out.</text><text x="522" y="1118" font-size="21" font-weight="800" fill="#ABA394" text-anchor="start" >Bend below</text><text x="522" y="1143" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >If the mixed pair is</text>
<text x="522" y="1167" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >faster, the curve sags</text>
<text x="522" y="1191" font-size="18" font-weight="400" fill="#ABA394" text-anchor="start" >under the line.</text><text x="44" y="1264" font-size="21" font-weight="400" fill="#EEE6D6" text-anchor="start" >Kagan reported this non-linear effect in 1986. Before that, chemists</text>
<text x="44" y="1292" font-size="21" font-weight="400" fill="#EEE6D6" text-anchor="start" >assumed that a ligand with a 50% lead of one hand gives a product</text>
<text x="44" y="1320" font-size="21" font-weight="400" fill="#EEE6D6" text-anchor="start" >with a 50% lead.</text><text x="44" y="1358" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >Simplified: the numbers follow the worked example in the Nobel</text>
<text x="44" y="1384" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >Committee’s popular science background, with the mixed pair doing</text>
<text x="44" y="1410" font-size="19" font-weight="400" fill="#ABA394" text-anchor="start" >nothing and the two same-hand pairs equally good. Our own drawing.</text></g>
